[project]
name = "apple-contacts-mcp"
version = "0.2.0"
description = "MCP server for Apple Contacts on macOS via the Contacts framework"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp[cli]>=2.0.0,<3",
    "pydantic>=2.0.0",
    "pyobjc-core>=10.0",
    "pyobjc-framework-Cocoa>=10.0",
    "pyobjc-framework-Contacts>=10.0",
]

[project.scripts]
apple-contacts-mcp = "apple_contacts_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/apple_contacts_mcp"]

[dependency-groups]
dev = []
